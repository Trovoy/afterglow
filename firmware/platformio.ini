; Afterglow controller firmware. Same toolchain as the verified lab firmware (do not upgrade to Arduino 3).
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv   ; two OTA app slots (1.9MB each) for later Wi-Fi updates
lib_deps = https://github.com/LSatan/SmartRC-CC1101-Driver-Lib.git#de6757ef633b3e626dae5c7835cdb66ab53f9a1d
build_flags = -Wall -Wextra
extra_scripts = pre:prefix_map.py   ; no build-machine paths in the shipped binary
